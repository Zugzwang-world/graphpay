name: "arkiv-graph feedback"
description: Tell us what worked, what broke, or what you need from @graphpay_ethglobal/arkiv-graph.
title: "[arkiv-graph] "
labels: ["arkiv-graph", "feedback"]
body:
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of feedback
      options: ["Bug", "Missing feature", "Quickstart or docs", "Other"]
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened, and what did you expect?
      description: Steps, code or the error message. Never paste private keys or keyed RPC URLs.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node version and backend (ArkivSim, local or Rabdi)
