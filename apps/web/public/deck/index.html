<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GraphPay draft presentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Mukta:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#ECEEF6; --bg-2:#E1E4F0; --panel:#FFFFFF; --ink:#1C1838; --muted:#5C5878; --line:#CDD0E1;
  --kesar:#9A5600; --kesar-fill:#F2A43A; --kesar-soft:#F8E3C2;
  --pista:#2F6E27; --pista-soft:#DCEDD2; --gulab:#A83254; --gulab-soft:#F6D5DF;
  --sky:#2459BF; --sky-soft:#DCE6FA; --violet:#5B3FBF; --violet-soft:#E4DCFB;
  --teal:#0E6F69; --teal-soft:#D0EEEB; --amber:#8C5208; --amber-soft:#F6E3C6;
  --frame:#1B1736; --shadow:0 28px 70px rgba(28,24,56,.20);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#16122F; --bg-2:#1D1840; --panel:#221C48; --ink:#F4EEDF; --muted:#B4AECB; --line:#3A3272;
    --kesar:#F5B455; --kesar-fill:#F2A43A; --kesar-soft:#44301A;
    --pista:#A9D68E; --pista-soft:#203520; --gulab:#F0839F; --gulab-soft:#45202F;
    --sky:#8DB8FF; --sky-soft:#1C2A50; --violet:#BCA7FF; --violet-soft:#2D2457;
    --teal:#6FDCD2; --teal-soft:#113A39; --amber:#F8C27A; --amber-soft:#3E2B12;
    --frame:#05040F; --shadow:0 30px 90px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#16122F; --bg-2:#1D1840; --panel:#221C48; --ink:#F4EEDF; --muted:#B4AECB; --line:#3A3272;
  --kesar:#F5B455; --kesar-fill:#F2A43A; --kesar-soft:#44301A;
  --pista:#A9D68E; --pista-soft:#203520; --gulab:#F0839F; --gulab-soft:#45202F;
  --sky:#8DB8FF; --sky-soft:#1C2A50; --violet:#BCA7FF; --violet-soft:#2D2457;
  --teal:#6FDCD2; --teal-soft:#113A39; --amber:#F8C27A; --amber-soft:#3E2B12;
  --frame:#05040F; --shadow:0 30px 90px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
body{height:100%; margin:0; background:var(--bg); color:var(--ink); font-family:"Mukta",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased;}
#viewport{position:relative; width:100%; height:100%; overflow:hidden; cursor:pointer;}
#stage{position:absolute; left:50%; top:50%; width:1920px; height:1080px; transform:translate(-50%,-50%); transform-origin:50% 50%; background:var(--bg); overflow:hidden;}
.slide{position:absolute; inset:0; display:none;}
.slide.active{display:block;}
h1,h2,h3,h4,h5{font-family:"Baloo 2","Mukta",system-ui,sans-serif;}
[data-k]{opacity:0; transform:translateY(10px); transition:opacity .45s ease, transform .45s ease;}
[data-k].on{opacity:1; transform:none;}
[data-x].out{opacity:0 !important; transform:scale(.6,.15) !important; pointer-events:none;}

/* chrome */
.progress{position:absolute; left:0; right:0; bottom:0; height:6px; background:var(--bg-2);}
.progress span{display:block; height:100%; width:0; background:var(--kesar-fill); transition:width .4s ease;}
.count{position:absolute; right:40px; bottom:20px; font-size:22px; color:var(--muted); font-variant-numeric:tabular-nums;}
.badge{position:absolute; left:40px; bottom:20px; font-size:20px; color:var(--muted);}
.tag{display:inline-block; padding:3px 12px; border-radius:999px; font-size:18px; font-weight:600; line-height:1.4; white-space:nowrap;}
.tag.ens{background:var(--sky-soft); color:var(--sky);}
.tag.arkiv{background:var(--violet-soft); color:var(--violet);}
.tag.wc{background:var(--teal-soft); color:var(--teal);}
.tag.swarm{background:var(--amber-soft); color:var(--amber);}
.tag.big{font-size:28px; padding:6px 22px;}
.partners{display:flex; gap:10px;}
.partners .tag{opacity:.28;}
.partners .tag.lit{opacity:1;}

/* demo layout */
.is-demo,.is-wide{padding:40px 72px 0;}
.top{display:flex; justify-content:space-between; align-items:center; height:84px;}
.top .title{margin:0; font-size:56px; font-weight:800; letter-spacing:-.01em; line-height:1;}
.cols{display:grid; grid-template-columns:380px 1fr 380px; column-gap:56px; margin-top:16px; height:780px;}
.device{margin:0; display:flex; flex-direction:column; align-items:center; gap:10px;}
.device figcaption{font-size:20px; color:var(--muted);}
.explain{display:flex; flex-direction:column; gap:14px; min-width:0; height:780px;}
.cap{margin:0; font-size:28px; font-weight:600; line-height:1.25;}
.viz{position:relative; flex:1; min-height:0;}
.foot{margin:0; font-size:20px; color:var(--muted); line-height:1.35;}

/* the phone: a desk where agents talk as a team */
.phone{width:380px; height:740px; border-radius:54px; border:10px solid #05040F; background:#0E0B1F; color:#EFE9DA; box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden;}
.phone .bar{height:42px; flex:none; display:flex; justify-content:space-between; align-items:center; padding:0 28px; font-size:16px; font-weight:600; color:#9C96B8;}
.phone .island{width:104px; height:28px; border-radius:16px; background:#05040F;}
.desk-head{flex:none; display:flex; align-items:center; gap:10px; padding:4px 16px 10px; border-bottom:1px solid #241F45;}
.stack{display:flex; flex:none;}
.stack svg{width:30px; height:30px; margin-left:-9px;}
.stack svg:first-child{margin-left:0;}
.dh{min-width:0;}
.dh b{display:block; font-size:19px; line-height:1.15;}
.dh small{display:block; font-size:13px; color:#9C96B8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.chat{flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:9px; padding:10px 12px; overflow:hidden;}
.msg{display:grid; grid-template-columns:30px 1fr; gap:8px; align-items:start;}
.msg .ava svg{width:30px; height:30px; display:block;}
.mbody{min-width:0;}
.nm{display:block; font-size:13.5px; font-weight:600; margin-bottom:2px;}
.txt{background:#1C1838; border-radius:4px 16px 16px 16px; padding:8px 11px; font-size:15px; line-height:1.35; overflow-wrap:anywhere;}
.msg.me{display:flex; justify-content:flex-end;}
.msg.me .txt{background:#F2A43A; color:#2A1A05; border-radius:16px 16px 4px 16px; max-width:88%; font-weight:500;}
.msg.alarm .txt{box-shadow:inset 0 0 0 2px #F0839F;}
.men{color:var(--c); font-weight:600; white-space:nowrap;}
.men i{display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--c); margin-right:3px; vertical-align:1px;}
.msg[data-k]:not(.on),.chat [data-k]:not(.on){display:none;}
.msg.on{animation:pop .35s ease both;}
@keyframes pop{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
.compose{flex:none; margin:6px 12px 14px; padding:10px 14px; border-radius:22px; background:#1C1838; color:#8E88AB; font-size:14px; display:flex; justify-content:space-between; align-items:center;}
.compose .mic{width:22px; height:22px; border-radius:50%; background:#EFE9DA;}
.c2{margin-top:6px; background:#100D24; border-radius:12px; padding:8px 10px; font-size:14px; box-shadow:inset 0 0 0 1.5px #F2A43A;}
.c2.red{box-shadow:inset 0 0 0 1.5px #F0839F;}
.c2 .r{display:flex; justify-content:space-between; gap:8px; align-items:baseline;}
.c2 .amt{font-family:"Baloo 2",sans-serif; font-size:26px; font-weight:800; line-height:1.1;}
.c2 .k2{color:#9C96B8;}
.c2 .lnk{color:#8DB8FF; text-decoration:underline; text-underline-offset:3px;}
.okc{color:#A9D68E;} .badc{color:#F0839F;}
.btns{display:flex; gap:6px; margin-top:6px;}
.btns span{flex:1; text-align:center; padding:5px 6px; border-radius:10px; background:#2A2450; font-weight:600; font-size:13.5px;}
.btns span.go{background:#F2A43A; color:#2A1A05;}
.slot{margin-top:6px; height:92px; border-radius:12px; border:2px dashed #3A3366; display:grid; place-items:center; color:#8E88AB; font-size:13px;}
.slot.out{display:none;}
.ph{display:block; width:100%; height:92px; border-radius:12px; margin-top:6px;}
.prog{display:flex; align-items:baseline; gap:6px;}
.prog b{font-family:"Baloo 2",sans-serif; font-size:24px; color:#F5B455; font-variant-numeric:tabular-nums;}
.tog{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.sw{width:42px; height:24px; border-radius:12px; background:#5A5378; position:relative; flex:none;}
.sw::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#EFE9DA;}

/* table and graph */
.tbl{position:absolute; inset:0 0 auto 0; background:var(--panel); border-radius:18px; box-shadow:inset 0 0 0 2px var(--line); padding:14px 16px; font-size:16px; transform-origin:50% 40%; transition:opacity .6s ease, transform .6s ease;}
.tbl .th,.tbl .tr{display:grid; grid-template-columns:80px 260px 230px 80px 90px; gap:10px; align-items:center; height:34px; padding:0 10px; white-space:nowrap;}
.tbl .th{color:var(--muted); font-weight:600; border-bottom:2px solid var(--line);}
.tbl .win{position:relative; height:408px; overflow:hidden; margin-top:4px;}
.tbl .tr{border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums;}
.tbl .tr .rf{color:var(--gulab); font-weight:600;}
.tbl .ptr{position:absolute; left:0; right:0; top:0; height:34px; border-radius:8px; background:rgba(242,164,58,.22); box-shadow:inset 0 0 0 2px var(--kesar-fill); opacity:0;}
.tbl.scanning .ptr{opacity:1;}
.meters{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:12px;}
.meters div{background:var(--bg-2); border-radius:12px; padding:8px 12px;}
.meters b{display:block; font-family:"Baloo 2",sans-serif; font-size:34px; font-weight:800; line-height:1.05; font-variant-numeric:tabular-nums;}
.meters span{font-size:16px; color:var(--muted);}
.gwrap{position:absolute; inset:0;}
.gwrap[data-k]:not(.on){transform:scale(.85);}
.gwrap[data-k]{transition:opacity .8s ease, transform .8s ease;}
.gsvg{width:100%; height:100%; display:block; overflow:visible;}
.gsvg .e{stroke:var(--line); stroke-width:2;}
.gsvg .e.pay{stroke:var(--violet); stroke-opacity:.45;}
.gsvg .e.ref{stroke:var(--gulab); stroke-dasharray:6 6;}
.gsvg .e.own{stroke:var(--sky); stroke-width:4;}
.gsvg .e.hot{stroke:var(--kesar-fill); stroke-width:5; stroke-opacity:1;}
.gsvg .n{fill:var(--panel); stroke:var(--muted); stroke-width:2;}
.gsvg .n.shop{fill:var(--kesar-soft); stroke:var(--kesar-fill); stroke-width:3;}
.gsvg .n.trap{fill:var(--gulab-soft); stroke:var(--gulab); stroke-width:3;}
.gsvg .n.me{fill:var(--sky-soft); stroke:var(--sky); stroke-width:3;}
.gsvg text{font-family:"Mukta",sans-serif; font-size:17px; fill:var(--ink);}
.gsvg .lb{font-weight:600;}
.gsvg .mu{fill:var(--muted); font-size:15px;}
.gsvg .bd rect{fill:var(--panel); stroke:var(--line); stroke-width:2;}
.gsvg .halo{fill:none; stroke:var(--kesar-fill); stroke-width:5;}
.gsvg .bd.hl rect{stroke:var(--kesar-fill); stroke-width:4;}
.gsvg .ov rect{fill:none; stroke:var(--kesar-fill); stroke-width:4;}
.gsvg .big{font-family:"Baloo 2",sans-serif; font-size:44px; font-weight:800; fill:var(--kesar);}
.gsvg .tagt{font-family:"Baloo 2",sans-serif; font-size:22px; font-weight:700; fill:var(--kesar);}

/* query panels */
.qp{border-radius:16px; background:var(--frame); color:#EDE6D6; padding:10px 16px 12px;}
.qp h5{margin:0 0 6px; font:600 18px "Mukta",sans-serif; color:#C9C3E0; display:flex; justify-content:space-between; align-items:center;}
.qp pre{margin:0; font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace; font-size:15px; line-height:1.4; white-space:pre; overflow:hidden;}
.qp .c{color:#8E88AB;} .qp .s{color:#F5B455;}
.chip{display:inline-block; padding:2px 10px; border-radius:999px; font:600 15px "Mukta",sans-serif; white-space:nowrap;}
.chip.bad{background:#45202F; color:#F0839F;}
.chip.good{background:#44301A; color:#F5B455;}
.qgrid{display:flex; flex-direction:column; gap:12px;}
.res{width:100%; border-collapse:collapse; font-size:20px; background:var(--panel); border-radius:14px; overflow:hidden; box-shadow:inset 0 0 0 2px var(--line);}
.res th,.res td{padding:6px 14px; text-align:left; border-bottom:1px solid var(--line);}
.res th{color:var(--muted); font-weight:600; font-size:17px;}
.res .n{text-align:right; font-variant-numeric:tabular-nums;}
.res tr.trap td{color:var(--gulab); font-weight:600;}
.res tr.best td{font-weight:700;}

/* x402 sequence */
.seq{width:100%; height:auto; display:block; overflow:visible;}
.seq .lane{stroke:var(--line); stroke-width:2; stroke-dasharray:4 6;}
.seq .lh{font:700 16px "Baloo 2",sans-serif; fill:var(--ink); text-anchor:middle;}
.seq .lh2{font:500 13px "Mukta",sans-serif; fill:var(--muted); text-anchor:middle;}
.seq .ar{stroke:var(--muted); stroke-width:2.5; fill:none;}
.seq .ah{fill:var(--muted);}
.seq .lab{font:500 15px "Mukta",sans-serif; fill:var(--muted); paint-order:stroke; stroke:var(--bg); stroke-width:5px; stroke-linejoin:round;}
.seq .num{fill:var(--bg-2); stroke:var(--line); stroke-width:2;}
.seq .numt{font:700 13px "Mukta",sans-serif; fill:var(--ink); text-anchor:middle;}
.seq .st.now .ar{stroke:var(--kesar-fill); stroke-width:4;}
.seq .st.now .ah{fill:var(--kesar-fill);}
.seq .st.now .lab{fill:var(--ink); font-weight:700;}
.seq .st.now .num{fill:var(--kesar-fill); stroke:var(--kesar-fill);}
.seq .st.now .numt{fill:#2A1A05;}
.caps{position:relative; height:40px; flex:none;}
.caps p{position:absolute; inset:0; margin:0; font-size:23px; font-weight:600; color:var(--ink);}

/* pipelines and chains */
.pipe{width:100%; height:auto; display:block; overflow:visible;}
.pipe text{font-family:"Mukta",sans-serif;}
.pipe .stn circle{fill:var(--panel); stroke:var(--line); stroke-width:3; transition:all .3s ease;}
.pipe .stn text{font-size:17px; fill:var(--muted); text-anchor:middle; font-weight:600;}
.pipe .stn .ic{font-family:"Baloo 2",sans-serif; font-size:20px; font-weight:800; fill:var(--muted);}
.pipe .stn.lit circle{fill:var(--kesar-soft); stroke:var(--kesar-fill);}
.pipe .stn.lit text{fill:var(--ink);}
.pipe .stn.now circle{stroke-width:7;}
.pipe .lk{stroke:var(--line); stroke-width:4;}
.pipe .lk.lit{stroke:var(--kesar-fill);}
.chips{display:flex; flex-wrap:wrap; gap:10px;}
.chips .tag{font-size:19px;}
.chain{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}
.chain li{display:grid; grid-template-columns:150px 1fr; gap:16px; align-items:center; padding:10px 16px; border-radius:16px; background:var(--panel); box-shadow:inset 0 0 0 2px var(--line); opacity:.4; transition:all .3s ease;}
.chain li.lit{opacity:1;}
.chain li.now{box-shadow:inset 0 0 0 3px var(--kesar-fill);}
.chain li.stop.lit{box-shadow:inset 0 0 0 3px var(--gulab);}
.chain .who{font-family:"Baloo 2",sans-serif; font-weight:700; font-size:21px;}
.chain .what{font-size:21px;}
.chain small{display:block; font-size:16px; color:var(--muted);}

/* small components */
.hand{display:grid; grid-template-columns:150px 70px 200px 1fr; align-items:center; gap:14px; margin-top:30px;}
.h-me{padding:14px; border-radius:18px; background:var(--kesar-fill); color:#2A1A05; font:800 26px "Baloo 2",sans-serif; text-align:center;}
.h-arrow{height:6px; border-radius:3px; background:var(--kesar-fill);}
.h-con{display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px; border-radius:18px; background:var(--panel); box-shadow:inset 0 0 0 2px var(--line); font:700 22px "Baloo 2",sans-serif;}
.h-con svg{width:58px; height:58px;}
.h-subs{display:flex; flex-direction:column; gap:10px; border-left:5px solid var(--kesar-fill); padding-left:18px;}
.h-subs div{display:grid; grid-template-columns:40px 110px 1fr; gap:10px; align-items:center; font-size:22px;}
.h-subs svg{width:36px; height:36px;}
.h-subs span{color:var(--muted);}
.h-desk{grid-column:1/-1; margin-top:22px; padding:16px 20px; border-radius:18px; background:var(--panel); box-shadow:inset 0 0 0 2px var(--line); font-size:23px;}
.tree2{display:flex; flex-direction:column; gap:16px; margin-top:20px;}
.tnode{align-self:flex-start; padding:8px 16px; border-radius:14px; background:var(--panel); box-shadow:inset 0 0 0 2px var(--line); font-size:22px; font-weight:600;}
.tnode.root{font:800 28px "Baloo 2",sans-serif;}
.tnode .who{display:block; font-size:16px; color:var(--muted); font-weight:500;}
.tbr{margin-left:30px; padding-left:24px; border-left:5px solid var(--kesar-fill); display:flex; flex-direction:column; gap:12px;}
.leaves{display:flex; flex-wrap:wrap; gap:10px;}
.leaf{display:flex; align-items:center; gap:8px; padding:4px 12px 4px 6px; border-radius:999px; background:var(--panel); box-shadow:inset 0 0 0 2px var(--line); font-size:19px;}
.leaf svg{width:28px; height:28px;}
.forms{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
.form{padding:14px 14px; border-radius:16px; background:var(--panel); box-shadow:inset 0 0 0 2px var(--line); display:flex; flex-direction:column; gap:4px;}
.form b{font-size:21px; line-height:1.15;}
.form small{font-size:16px; color:var(--muted);}
.form.hot{box-shadow:inset 0 0 0 3px var(--kesar-fill);}
.pair{display:flex; align-items:center; gap:14px; padding:38px 18px 16px; border-radius:18px; background:var(--panel); box-shadow:inset 0 0 0 2px var(--line); font-size:22px;}
.pair .ln{flex:1; height:6px; border-radius:3px; background:var(--kesar-fill); position:relative;}
.pair .ln b{position:absolute; left:50%; top:-34px; transform:translateX(-50%); font:800 22px "Baloo 2",sans-serif; color:var(--kesar); white-space:nowrap;}
.code{margin:0; padding:12px 16px; border-radius:16px; background:var(--frame); color:#EDE6D6; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:16px; line-height:1.4; white-space:pre; overflow:hidden;}
.code .c{color:#8E88AB;} .code .s{color:#F5B455;}
.recs{padding:16px 20px; border-radius:20px; background:var(--panel); box-shadow:inset 0 0 0 2px var(--line);}
.recs h4{margin:0 0 8px; font-size:24px;}
.recs dl{display:grid; grid-template-columns:170px 1fr 120px; gap:8px 14px; margin:0; font-size:20px; align-items:center;}
.recs dt{color:var(--muted);}
.recs dd{margin:0; font-weight:600;}
.att{display:grid; grid-template-columns:56px 1fr; gap:16px; align-items:center; padding:14px 18px; border-radius:20px; background:var(--panel); margin-top:12px;}
.att .mk{width:56px; height:56px; border-radius:50%; display:grid; place-items:center; font-size:30px; font-weight:800;}
.att.ok .mk{background:var(--pista-soft); color:var(--pista);}
.att.no{box-shadow:inset 0 0 0 2px var(--gulab);}
.att.no .mk{background:var(--gulab-soft); color:var(--gulab);}
.att b{display:block; font-size:24px;}
.att small{font-size:19px; color:var(--muted);}

/* config strip */
.config{position:absolute; left:72px; right:72px; bottom:54px; display:flex; flex-wrap:wrap; align-items:center; align-content:flex-end; gap:6px 10px; font-size:18px; color:var(--muted);}
.config .lbl{font-weight:600; color:var(--ink);}
.config code{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:16px; padding:2px 8px; border-radius:8px; background:var(--bg-2); color:var(--ink);}
.config .list{margin-left:auto; white-space:nowrap;}
#stage.no-config .config{display:none;}

/* title, problem, solution */
.title-s{position:absolute; inset:0; padding:110px 120px;}
.brand{margin:0; font-size:240px; font-weight:800; line-height:.9; letter-spacing:-.02em;}
.tagline{margin:22px 0 0; font-family:"Baloo 2",sans-serif; font-size:70px; font-weight:600; color:var(--kesar);}
.subline{margin:14px 0 0; font-size:32px; color:var(--muted); max-width:40em;}
.title-s .thread{position:absolute; left:120px; bottom:170px; width:1680px; height:240px; overflow:visible;}
.t-line{stroke:var(--kesar-fill); stroke-width:8; stroke-linecap:round; stroke-dasharray:1600; stroke-dashoffset:1600; animation:draw 1.6s ease .3s forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}
.t-end{fill:var(--kesar-fill);}
.t-knot{fill:var(--bg); stroke:var(--kesar-fill); stroke-width:8;}
.t-k{font-family:"Baloo 2",sans-serif; font-size:38px; font-weight:700; fill:var(--ink);}
.t-p{font-family:"Mukta",sans-serif; font-size:24px; fill:var(--muted);}
.t-lbl{font-family:"Mukta",sans-serif; font-size:24px; fill:var(--muted);}
.event{position:absolute; left:120px; bottom:80px; margin:0; font-size:24px; color:var(--muted);}
.prob2,.sol,.pt,.close-s{position:absolute; inset:0; padding:90px 110px;}
.head{margin:0; font-size:74px; font-weight:800; line-height:1.04; letter-spacing:-.01em; max-width:16em;}
.pgrid{display:grid; grid-template-columns:700px 1fr; gap:60px; margin-top:40px; align-items:start;}
.qs2{list-style:none; margin:0; padding:0;}
.qs2 li{padding:18px 0; border-top:2px solid var(--line); display:flex; flex-direction:column; gap:4px;}
.qs2 b{font-family:"Baloo 2",sans-serif; font-size:38px; font-weight:700; line-height:1.1;}
.qs2 span{font-size:25px; color:var(--muted); line-height:1.35;}
.coda{margin:30px 0 0; font-size:28px; font-weight:600; line-height:1.3;}
.chart{margin:0; background:var(--panel); border-radius:24px; box-shadow:inset 0 0 0 2px var(--line); padding:12px;}
.chart svg{width:100%; height:auto; display:block;}
.chart text{font-family:"Mukta",sans-serif; font-size:17px; fill:var(--muted);}
.chart .ax{stroke:var(--line); stroke-width:2;}
.chart .pl{stroke:var(--gulab); stroke-width:5; fill:none; stroke-linecap:round;}
.chart .pl.dash{stroke-dasharray:10 10;}
.chart .gl{stroke:var(--kesar-fill); stroke-width:7; fill:none; stroke-linecap:round;}
.chart .pt2{fill:var(--gulab);}
.chart .vl{font-family:"Baloo 2",sans-serif; font-size:26px; font-weight:800; fill:var(--ink);}
.chart .vg{font-family:"Baloo 2",sans-serif; font-size:26px; font-weight:800; fill:var(--kesar);}
.pillars{position:relative; display:grid; grid-template-columns:1fr 1.25fr 1fr; gap:44px; margin-top:76px; padding-top:56px;}
.pillars::before{content:""; position:absolute; left:0; right:0; top:14px; height:6px; border-radius:3px; background:var(--kesar-fill);}
.pillar{position:relative;}
.pillar::before{content:""; position:absolute; top:-56px; left:0; width:34px; height:34px; border-radius:50%; background:var(--bg); box-shadow:inset 0 0 0 7px var(--kesar-fill);}
.pillar h3{margin:12px 0 8px; font-size:54px; font-weight:800; line-height:1;}
.pillar p{margin:0; font-size:26px; line-height:1.35; color:var(--muted);}
.pillar.hot{padding:0 0 0 0;}
.pillar.hot h3{color:var(--kesar);}
.pillar.hot p{color:var(--ink);}

/* partner slides */
.pt-head{display:flex; flex-direction:column; align-items:flex-start; gap:16px;}
.head2{margin:0; font-size:60px; font-weight:800; line-height:1.05; letter-spacing:-.01em; max-width:20em;}
.pt-grid{display:grid; grid-template-columns:800px 1fr; gap:50px; margin-top:38px; align-items:start;}
.pt-viz{margin:0; background:var(--panel); border-radius:24px; box-shadow:inset 0 0 0 2px var(--line); padding:16px;}
.pt-viz svg{width:100%; height:auto; display:block;}
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.tile{background:var(--panel); border-radius:20px; padding:14px 18px; box-shadow:inset 0 0 0 2px var(--line);}
.tile b{display:block; font-family:"Baloo 2",sans-serif; font-size:38px; font-weight:800; line-height:1.05; color:var(--kesar);}
.tile span{display:block; font-size:20px; font-weight:600; margin-top:2px;}
.tile small{display:block; font-size:15.5px; color:var(--muted); margin-top:3px;}
.coda2{position:absolute; left:110px; right:110px; bottom:86px; margin:0; font-size:25px; line-height:1.35;}
.recap{display:grid; grid-template-columns:300px 1fr; gap:22px 44px; margin:50px 0 0;}
.recap dt{font-family:"Baloo 2",sans-serif; font-size:34px; font-weight:700; color:var(--kesar);}
.recap dd{margin:0; font-size:29px; line-height:1.35;}
.links{position:absolute; left:110px; right:110px; bottom:80px; margin:0; font-size:24px; color:var(--muted);}

/* wide slide */
.wide-grid{display:grid; grid-template-columns:860px 1fr; gap:56px; margin-top:16px; height:790px;}
.ent{padding:16px 20px; border-radius:20px; background:var(--panel); box-shadow:inset 0 0 0 2px var(--line);}
.ent h4{margin:0 0 6px; font-size:26px;}
.ent dl{display:grid; grid-template-columns:120px 1fr; gap:4px 14px; margin:6px 0; font-size:20px;}
.ent dt{color:var(--muted);} .ent dd{margin:0; font-weight:600;}
.ent p{margin:6px 0 0; font-size:19px; color:var(--muted);}
.map{width:100%; height:100%; overflow:visible;}
.map .shape{fill:var(--panel); stroke:var(--line); stroke-width:3;}
.map .ce{stroke:var(--violet); stroke-opacity:.28; stroke-width:1.2;}
.map .d-s{fill:var(--kesar-fill);} .map .d-a{fill:var(--sky);}
.map .ring{fill:none; stroke:var(--ink); stroke-width:3;}
.map .m-thread{fill:none; stroke:var(--kesar-fill); stroke-width:6; stroke-linecap:round;}
.map .who{font-family:"Baloo 2",sans-serif; font-size:24px; font-weight:700; fill:var(--ink);}
.map .area{font-family:"Mukta",sans-serif; font-size:18px; fill:var(--muted);}
.map .note{font-family:"Mukta",sans-serif; font-size:16px; fill:var(--muted);}

/* controls */
#hud{position:fixed; right:0; bottom:0; padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px)); display:flex; gap:8px; z-index:5; opacity:.4; transition:opacity .2s;}
#hud:hover,#hud:focus-within{opacity:1;}
#hud button{font:600 14px "Mukta",system-ui,sans-serif; color:var(--ink); background:var(--panel); border:0; border-radius:999px; padding:8px 14px; box-shadow:inset 0 0 0 2px var(--line); cursor:pointer;}
#hud button:focus-visible{outline:3px solid var(--kesar-fill); outline-offset:2px;}
#notes{position:fixed; top:0; right:0; bottom:0; width:min(420px,92vw); padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(18px + env(safe-area-inset-bottom,0px)); background:var(--panel); color:var(--ink); box-shadow:-20px 0 60px rgba(0,0,0,.25); transform:translateX(105%); transition:transform .25s ease; z-index:6; overflow-y:auto;}
#notes.open{transform:none;}
#notes h3{margin:0 0 6px; font-size:24px;}
#notes .n-meta,#notes .n-clock{color:var(--muted); font-size:15px; margin:0 0 10px; font-variant-numeric:tabular-nums;}
#notes .n-text{font-size:18px; line-height:1.5; margin:0 0 14px;}
#notes .keys{font-size:14px; color:var(--muted); border-top:1px solid var(--line); padding-top:10px; line-height:1.6;}

/* embed mode (booth): only the middle of each slide, with Back and Next, framed by the live site */
.embed #notes,.embed .progress,.embed .count,.embed .badge,.embed .device,.embed .config,.embed .partners,.embed #hud [data-act=notes],.embed #hud [data-act=config],.embed #hud [data-act=full]{display:none !important}
.embed #stage{left:0; top:0; transform-origin:0 0; width:960px;}
.embed .is-demo,.embed .is-wide{padding:20px 28px 0;}
.embed .top{height:auto; margin-bottom:6px;} .embed .top .title{font-size:42px;}
.embed .cols{display:block; height:auto; margin-top:6px;}
.embed .pgrid,.embed .pt-grid,.embed .wide-grid,.embed .pillars,.embed .hand{grid-template-columns:1fr !important; height:auto !important; gap:22px !important; margin-top:20px !important;}
.embed .pillars{margin-top:60px !important;}
.embed #hud{left:50%; right:auto; transform:translateX(-50%); opacity:1; padding:8px; background:var(--bg); border-radius:999px;}
.embed #hud button{padding:6px 18px; font-size:15px;}
.embed .title-s{padding:60px 40px;} .embed .brand{font-size:130px;} .embed .title-s .thread{left:40px; width:880px; bottom:120px; height:150px;}
.embed .head{font-size:48px;} .embed .head2{font-size:40px;} .embed .coda2{left:40px; right:40px; font-size:20px;}
@media (prefers-reduced-motion: reduce){
  [data-k]{transition:none; transform:none;}
  .msg.on{animation:none;}
  .t-line{animation:none; stroke-dashoffset:0;}
  .progress span,.tbl,.gwrap[data-k]{transition:none !important;}
}
</style>
</head>
<body>
<div id="viewport"><div id="stage" aria-live="polite"></div></div>
<div id="hud" aria-label="Deck controls">
  <button type="button" data-act="prev">Back</button>
  <button type="button" data-act="next">Next</button>
  <button type="button" data-act="notes">Notes</button>
  <button type="button" data-act="config">Config</button>
  <button type="button" data-act="full">Full screen</button>
</div>
<aside id="notes" aria-label="Speaker notes">
  <h3 class="n-title"></h3>
  <p class="n-meta"></p>
  <p class="n-clock"></p>
  <p class="n-text"></p>
  <div class="keys">Keys: Right arrow or Space for next, Left arrow for back, N notes, C story-config strip, F full screen, T light or dark, R replay this slide. Slides with a sequence play on by themselves after the first click; click again to skip ahead.</div>
</aside>
<script>
(() => {
/* Sample story config. Names and prices are the booth story's synthetic data. Numbers marked "lab" were measured in the pre-event lab and will be re-measured at the event. */
const EMBED = /[?&]embed=1/.test(location.search);
if (EMBED) document.documentElement.classList.add('embed');
const STORY = {
  hero: { name: 'Vitalik', label: 'vitalik', area: 'BKC', orders: 37 },
  team: [
    { id: 'concierge', name: 'Concierge', color: '#F2A43A' },
    { id: 'scout', name: 'Scout', color: '#9B7BFF' },
    { id: 'analyst', name: 'Analyst', color: '#EF6F8E' },
    { id: 'payer', name: 'Payer', color: '#4FD1C5' }
  ],
  shopTeam: [
    { id: 'storefront', name: 'Storefront', color: '#F6AD55' },
    { id: 'risk', name: 'Risk', color: '#E86A6A' },
    { id: 'dispatch', name: 'Dispatch', color: '#7FB0FF' }
  ],
  errand: { text: 'Just landed in Mumbai. Get me the best masala dosa near BKC under 6 USDT by 8 pm.' },
  cap: 100,
  shops: [
    { name: 'Filter & Fold', label: 'kesar-kingdom', area: 'BKC', price: 4.80, orders: 4812, refunds: 58 },
    { name: 'Idli Index', label: 'syrup-street', area: 'Bandra East', price: 4.20, orders: 1204, refunds: 37 },
    { name: 'Tawa Tangle', label: 'jamun-junction', area: 'Kalina', price: 3.30, orders: 2190, refunds: 403, trap: true }
  ],
  order: { id: 'FF-0412', eta: '19:55' },
  refund: { reason: 'The coffee arrived cold.', amount: 0.80 },
  renewal: { item: 'Sunday breakfast box', price: 2.40, weeks: 4 },
  lab: { receipts: 9612, shops: 40, plainReads: 48, graphReads: 2, emuReceipts: 50000, emuPlainReads: 232,
         payGas: '234,292', payWbt: '0.00117', refundGas: '75,344', refuseGas: '33,000–120,000', arkivTglm: '0.00031' },
  tx: '0x7f3c…a219', swarmRef: 'b7e1…09cf'
};

const H = STORY.hero, E = STORY.errand, SH = STORY.shops, shop = SH[0], trap = SH[2], L = STORY.lab;
const AG = {}; STORY.team.concat(STORY.shopTeam).forEach(a => { AG[a.id] = a; });
const PARTNERS = [['ens', 'ENS'], ['arkiv', 'Arkiv'], ['wc', 'Whitechain'], ['swarm', 'Swarm']];
const ens = l => `${l}.graphpay.eth`;
const sub = (a, p) => `${a}.${p}.graphpay.eth`;
const payer = sub('payer', H.label);
const usd = n => Number(n).toFixed(2);
const num = n => Number(n).toLocaleString('en-IN');
const pct = (a, b) => (a / b * 100).toFixed(1) + '%';
const K = k => ` data-k="${k}"`;
const plain = t => String(t).replace(/<[^>]+>/g, '');

/* desk building blocks */
const blob = c => `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2.5C30.6 2.5 37.5 9.7 37.5 20.3 37.5 30.7 30.2 37.5 19.6 37.5 9.2 37.5 2.5 30.3 2.5 20.4 2.5 9.4 9.5 2.5 20 2.5Z" fill="${c}"/><ellipse cx="14.6" cy="18" rx="2.6" ry="3.8" fill="#1A1126"/><ellipse cx="25.4" cy="18" rx="2.6" ry="3.8" fill="#1A1126"/></svg>`;
const at = id => `<span class="men" style="--c:${AG[id].color}"><i></i>${AG[id].name}</span>`;
const atP = `<span class="men" style="--c:#F2A43A"><i></i>${H.name}</span>`;
const M = (k, id, html, cls) => `<div class="msg${cls ? ' ' + cls : ''}"${k ? K(k) : ''}><span class="ava">${blob(AG[id].color)}</span><div class="mbody"><b class="nm" style="color:${AG[id].color}">${AG[id].name}</b><div class="txt">${html}</div></div></div>`;
const ME = (k, html) => `<div class="msg me"${k ? K(k) : ''}><div class="txt">${html}</div></div>`;
function desk(side, body, time) {
  const team = side === 'hero' ? STORY.team : STORY.shopTeam;
  const title = side === 'hero' ? `${H.name}’s desk` : `${shop.name}’s desk`;
  const owner = side === 'hero' ? ens(H.label) : ens(shop.label);
  return `<div class="phone"><div class="bar"><span>${time || '19:42'}</span><span class="island"></span><span>5G</span></div>
    <div class="desk-head"><div class="stack">${team.map(t => blob(t.color)).join('')}</div><div class="dh"><b>${title}</b><small>${owner}, ${team.length} agents</small></div></div>
    <div class="chat">${body}</div>
    <div class="compose"><span>Message the desk</span><i class="mic"></i></div></div>`;
}
const partnersHtml = list => `<div class="partners">${PARTNERS.map(([id, name]) => `<span class="tag ${id}${list.includes(id) ? ' lit' : ''}">${name}</span>`).join('')}</div>`;
function configHtml(sl) {
  const fields = sl.config && sl.config.length ? sl.config.map(f => `<code>${f}</code>`).join('') : `<span>Nothing to set here: the backend writes it.</span>`;
  return `<div class="config"><span class="lbl">Story config used here</span>${fields}${sl.list ? `<span class="list">Your list: ${sl.list}</span>` : ''}</div>`;
}

/* illustrations */
const PHOTO = `<svg class="ph" viewBox="0 0 300 92" preserveAspectRatio="xMidYMid slice" aria-label="Photo of the order"><rect width="300" height="92" fill="#2B2448"/><ellipse cx="150" cy="54" rx="128" ry="34" fill="#E9E1CF"/><ellipse cx="150" cy="54" rx="108" ry="25" fill="#F6F0E2"/>${[[88,48],[122,58],[156,46],[188,58],[118,40]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="14" fill="#8A4317"/><circle cx="${x - 4}" cy="${y - 5}" r="4" fill="#C47A3A"/>`).join('')}<ellipse cx="222" cy="62" rx="24" ry="7" fill="#6B310F"/><ellipse cx="214" cy="59" rx="6" ry="2.4" fill="#A0582A"/></svg>`;
const MENU = `<svg class="ph" viewBox="0 0 300 92" preserveAspectRatio="xMidYMid slice" aria-label="Menu photo"><rect width="300" height="92" fill="#2B2448"/><rect x="18" y="14" width="120" height="64" rx="10" fill="#3A3366"/>${[[48,46],[78,46],[108,46]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="13" fill="#8A4317"/><circle cx="${x - 4}" cy="${y - 4}" r="4" fill="#C47A3A"/>`).join('')}<rect x="156" y="22" width="120" height="10" rx="5" fill="#EFE9DA"/><rect x="156" y="42" width="90" height="8" rx="4" fill="#8E88AB"/><rect x="156" y="58" width="104" height="8" rx="4" fill="#8E88AB"/></svg>`;

/* table rows for the scan */
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const PAYEES = ['kesar-kingdom', 'syrup-street', 'jamun-junction', 'shop-07.sim', 'shop-12.sim', 'shop-23.sim', 'shop-31.sim'];
function rowsHtml(n) {
  const r = mulberry32(42); let s = '';
  for (let i = 0; i < n; i++) {
    const p = PAYEES[Math.floor(r() * PAYEES.length)];
    const who = i === 5 ? payer : `sim-${String(Math.floor(r() * 9000) + 1000)}.sim.graphpay.eth`;
    const refund = p === 'jamun-junction' ? r() < 0.4 : r() < 0.06;
    const amt = (2.5 + r() * 3.5).toFixed(2);
    s += `<div class="tr"><span>${num(9500 + i * 2 + 1)}</span><span>${who.replace('.graphpay.eth', '')}</span><span>${p}</span><span>${amt}</span><span class="${refund ? 'rf' : ''}">${refund ? 'refund' : 'payment'}</span></div>`;
  }
  return s;
}
function tableHtml(live, attrs) {
  return `<div class="tbl${live ? ' live' : ''}"${attrs}>
    <div class="th"><span>receipt</span><span>payer</span><span>payee</span><span>USDT</span><span>kind</span></div>
    <div class="win"><div class="rows">${rowsHtml(live ? 48 : 12)}</div><div class="ptr"></div></div>
    <div class="meters"><div><b class="sc-reads">${live ? 0 : L.plainReads}</b><span>reads of ${L.plainReads}</span></div><div><b class="sc-rcpts">${live ? 0 : num(L.receipts)}</b><span>receipts scanned</span></div><div><b class="sc-mb">${live ? '0.00' : '1.00'}</b><span>MB downloaded, about</span></div></div>
  </div>`;
}

/* graph of the same receipts */
function graphSvg() {
  const shopsXY = [[230, 290, SH[0]], [470, 130, SH[1]], [700, 300, SH[2]]];
  const buyers = [[110, 170], [130, 410], [300, 120], [580, 70], [640, 190], [570, 430], [790, 180], [820, 420], [680, 480], [440, 300], [100, 290], [260, 470], [360, 470]];
  const me = [330, 400];
  const r = mulberry32(7); let e = '';
  buyers.forEach(([x, y]) => {
    const t = shopsXY[Math.floor(r() * 3)];
    const isRef = t[2].trap && r() < 0.6;
    e += `<line class="e ${isRef ? 'ref' : 'pay'}" x1="${x}" y1="${y}" x2="${t[0]}" y2="${t[1]}"/>`;
    if (r() < 0.5) { const t2 = shopsXY[Math.floor(r() * 3)]; e += `<line class="e pay" x1="${x}" y1="${y}" x2="${t2[0]}" y2="${t2[1]}"/>`; }
  });
  e += `<line class="e pay" x1="${me[0]}" y1="${me[1]}" x2="230" y2="290"/><line class="e pay" x1="${me[0]}" y1="${me[1]}" x2="470" y2="130"/>`;
  const nodes = buyers.map(([x, y]) => `<circle class="n" cx="${x}" cy="${y}" r="9"/>`).join('') +
    `<circle class="n me" cx="${me[0]}" cy="${me[1]}" r="13"/><text class="lb" x="${me[0] + 18}" y="${me[1] + 30}">payer.vitalik</text>` +
    shopsXY.map(([x, y, s]) => `<circle class="n ${s.trap ? 'trap' : 'shop'}" cx="${x}" cy="${y}" r="30"/><text class="lb" x="${x}" y="${y - 40}" text-anchor="middle">${s.name}</text>`).join('') +
    `<text class="mu" x="110" y="150" text-anchor="middle">sim-4412</text><text class="mu" x="790" y="160" text-anchor="middle">sim-1187</text>`;
  const badges = shopsXY.map(([x, y, s]) => `<g class="bd"><rect x="${x - 90}" y="${y + 38}" width="180" height="52" rx="12"/><text x="${x}" y="${y + 60}" text-anchor="middle" font-size="15">${num(s.orders)} orders</text><text x="${x}" y="${y + 80}" text-anchor="middle" font-size="15">${s.refunds} refunds</text></g>`).join('');
  const halos = shopsXY.map(([x, y]) => `<circle class="halo" cx="${x}" cy="${y}" r="42"/>`).join('');
  const hlBadges = shopsXY.map(([x, y]) => `<g class="ov"><rect x="${x - 90}" y="${y + 38}" width="180" height="52" rx="12"/></g>`).join('');
  return `<svg class="gsvg" viewBox="0 0 900 600" aria-label="The receipts drawn as a graph of ENS names">
    ${e}${nodes}${badges}
    <g${K(2)}>${halos}<text class="tagt" x="20" y="580">Read 1: shops near ${H.area}</text></g>
    <g${K(3)}>${hlBadges}<text class="tagt" x="460" y="580">Read 2: their scoreboards</text><text class="big" x="900" y="40" text-anchor="end"><tspan data-count="2">0</tspan> reads</text></g>
  </svg>`;
}

/* buyer check-back graph */
function buyerSvg() {
  return `<svg class="gsvg" viewBox="0 0 900 560" aria-label="The buyer agent, its owner and its history">
    <line class="e own" x1="450" y1="280" x2="450" y2="90"/>
    <line class="e pay" x1="450" y1="280" x2="210" y2="440" style="stroke-width:6"/>
    <line class="e pay" x1="450" y1="280" x2="690" y2="440" style="stroke-width:5"/>
    <circle class="n me" cx="450" cy="280" r="26"/><text class="lb" x="490" y="286">${payer}</text>
    <circle class="n" cx="450" cy="90" r="22" style="stroke:var(--sky);stroke-width:3"/><text class="lb" x="482" y="96">${ens(H.label)}</text><text class="mu" x="482" y="120">owner, from ENS</text>

function build(sl) {
  let inner;
  if (sl.kind === 'demo') {
    inner = `<header class="top"><h2 class="title">${sl.title}</h2>${partnersHtml(sl.partners)}</header>
      <div class="cols">
        <figure class="device">${desk('hero', sl.left, sl.time)}<figcaption>${H.name}’s phone</figcaption></figure>
        <div class="explain"><p class="cap">${sl.cap}</p>${sl.center}</div>
        <figure class="device">${desk('shop', sl.right, sl.time)}<figcaption>${shop.name}’s phone</figcaption></figure>
      </div>${configHtml(sl)}`;
  } else {
    inner = typeof sl.html === 'function' ? sl.html() : sl.html;
  }
  const kind = sl.kind === 'demo' ? 'demo' : sl.kind === 'wide' ? 'wide' : sl.kind;
  return `<section class="slide is-${kind}" aria-label="${plain(sl.title)}">${inner}</section>`;
}

const stage = document.getElementById('stage');
const viewport = document.getElementById('viewport');
const notesEl = document.getElementById('notes');
stage.innerHTML = slides.map(build).join('') +
  `<div class="badge">Draft deck: sample names and prices; numbers marked lab were measured before the event</div><div class="count" id="count"></div><div class="progress"><span id="prog"></span></div>`;
const els = Array.from(stage.querySelectorAll('.slide'));
const reduce = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
let S = 0, KS = 0, t0 = null, slideT0 = Date.now(), lastS = -1, autoT = null;

function runCounters(root) {
  const list = root.matches('[data-count]') ? [root] : Array.from(root.querySelectorAll('[data-count]'));
  list.forEach(el => {
    const to = Number(el.dataset.count);
    cancelAnimationFrame(el._raf);
    if (reduce) { el.textContent = to; return; }
    const dur = to > 10 ? 1600 : 450, start = performance.now();
    const tick = now => { const p = Math.min(1, (now - start) / dur); el.textContent = Math.round(to * p); if (p < 1) el._raf = requestAnimationFrame(tick); };
    el._raf = requestAnimationFrame(tick);
  });
}
function resetCounters(root) {
  const list = root.matches('[data-count]') ? [root] : Array.from(root.querySelectorAll('[data-count]'));
  list.forEach(el => { cancelAnimationFrame(el._raf); el.textContent = '0'; });
}
function scanParts(trig) {
  const slide = trig.closest('.slide'); const tbl = slide.querySelector('.tbl.live');
  return tbl ? { slide, tbl, rows: tbl.querySelector('.rows'), ptr: tbl.querySelector('.ptr'), R: tbl.querySelector('.sc-reads'), C: tbl.querySelector('.sc-rcpts'), MB: tbl.querySelector('.sc-mb'), ticks: slide.querySelectorAll('.tick') } : null;
}
function startScan(trig) {
  const p = scanParts(trig); if (!p) return;
  const total = Number(trig.dataset.scan), rowH = 34, vis = 12; let i = 0;
  clearInterval(p.tbl._iv); p.tbl.classList.add('scanning');
  const step = () => {
    const off = Math.max(0, i - (vis - 3));
    p.rows.style.transform = `translateY(${-off * rowH}px)`;
    p.ptr.style.transform = `translateY(${(i - off) * rowH}px)`;
    p.R.textContent = i + 1;
    p.C.textContent = num(Math.round((i + 1) / total * L.receipts));
    p.MB.textContent = ((i + 1) / total).toFixed(2);
    p.ticks.forEach(t => { t.textContent = i + 1; });
    i++;
    if (i >= total) { clearInterval(p.tbl._iv); setTimeout(() => p.tbl.classList.remove('scanning'), 400); }
  };
  if (reduce) { i = total - 1; step(); return; }
  step(); p.tbl._iv = setInterval(step, 65);
}
function resetScan(trig) {
  const p = scanParts(trig); if (!p) return;
  clearInterval(p.tbl._iv); p.tbl.classList.remove('scanning');
  p.rows.style.transform = ''; p.ptr.style.transform = '';
  p.R.textContent = '0'; p.C.textContent = '0'; p.MB.textContent = '0.00';
  p.ticks.forEach(t => { t.textContent = '0'; });
}
const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function updateNotes() {
  if (S !== lastS) { slideT0 = Date.now(); lastS = S; }
  const sl = slides[S];
  const planned = slides.slice(0, S).reduce((a, b) => a + b.secs, 0);
  const total = slides.reduce((a, b) => a + b.secs, 0);
  notesEl.querySelector('.n-title').textContent = `${S + 1}. ${plain(sl.title)}`;
  notesEl.querySelector('.n-meta').textContent = `Target ${sl.secs} s. Planned start ${fmt(planned * 1000)} of ${fmt(total * 1000)}.`;
  notesEl.querySelector('.n-text').textContent = sl.notes;
}
function apply(i, k) {
  const root = els[i];
  root.querySelectorAll('[data-k]').forEach(el => {
    const kk = Number(el.dataset.k), on = kk <= k, was = el.classList.contains('on');
    el.classList.toggle('on', on);
    el.classList.toggle('now', kk === k);
    if (on && !was) { runCounters(el); if (el.hasAttribute('data-scan')) startScan(el); }
    if (!on && was) { resetCounters(el); if (el.hasAttribute('data-scan')) resetScan(el); }
  });
  root.querySelectorAll('[data-x]').forEach(el => { el.classList.toggle('out', k >= Number(el.dataset.x)); });
  root.querySelectorAll('[data-l]').forEach(el => { const l = Number(el.dataset.l); el.classList.toggle('lit', k >= l); el.classList.toggle('now', k === l); });
}
function show(i, k) {
  i = Math.max(0, Math.min(slides.length - 1, i));
  const max = slides[i].steps || 0;
  k = Math.max(0, Math.min(max, k));
  if (i !== S) els[S].classList.remove('active');
  els[i].classList.add('active');
  S = i; KS = k;
  apply(i, k);
  document.getElementById('count').textContent = `${i + 1} / ${slides.length}`;
  document.getElementById('prog').style.width = `${(i + 1) / slides.length * 100}%`;
  const h = `#s${i + 1}`;
  if (location.hash !== h) { try { history.replaceState(null, '', h); } catch (e) {} }
  updateNotes();
}
function stopAuto() { clearTimeout(autoT); autoT = null; }
function schedule() {
  const a = slides[S].auto;
  if (a && KS >= a.from && KS < a.to) autoT = setTimeout(() => { autoT = null; next(true); }, reduce ? Math.max(a.ms, 1600) : a.ms);
}
function next(fromAuto) {
  if (!fromAuto) stopAuto();
  if (!t0) t0 = Date.now();
  const max = slides[S].steps || 0;
  if (KS < max) show(S, KS + 1); else if (S < slides.length - 1) show(S + 1, 0);
  schedule();
}
function prev() { stopAuto(); if (KS > 0) show(S, KS - 1); else if (S > 0) show(S - 1, slides[S - 1].steps || 0); }
function toggleNotes() { notesEl.classList.toggle('open'); }
function toggleConfig() { stage.classList.toggle('no-config'); }
function toggleFull() {
  const d = document;
  if (!d.fullscreenElement) { const p = d.documentElement.requestFullscreen && d.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
  else if (d.exitFullscreen) d.exitFullscreen();
}
function toggleTheme() {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  r.dataset.theme = dark ? 'light' : 'dark';
}
function fit() {
  const r = viewport.getBoundingClientRect();
  if (EMBED) {
    const e = r.width / 960 || 1;
    stage.style.height = `${r.height / e}px`;
    stage.style.transform = `scale(${e})`;
    return;
  }
  const s = Math.min(r.width / 1920, r.height / 1080) || 1;
  stage.style.transform = `translate(-50%, -50%) scale(${s})`;
}
function fromHash() { const m = /^#s(\d+)$/.exec(location.hash); return m ? Math.min(slides.length, Math.max(1, Number(m[1]))) - 1 : 0; }

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const key = e.key;
  if (key === 'ArrowRight' || key === 'PageDown' || key === ' ' || key === 'Enter') { e.preventDefault(); next(); }
  else if (key === 'ArrowLeft' || key === 'PageUp') { e.preventDefault(); prev(); }
  else if (key === 'Home') { stopAuto(); show(0, 0); }
  else if (key === 'End') { stopAuto(); show(slides.length - 1, slides[slides.length - 1].steps || 0); }
  else if (key === 'n' || key === 'N') toggleNotes();
  else if (key === 'c' || key === 'C') toggleConfig();
  else if (key === 'f' || key === 'F') toggleFull();
  else if (key === 't' || key === 'T') toggleTheme();
  else if (key === 'r' || key === 'R') { stopAuto(); show(S, 0); }
});
viewport.addEventListener('click', e => {
  const r = viewport.getBoundingClientRect();
  if ((e.clientX - r.left) / r.width < 0.33) prev(); else next();
});
document.getElementById('hud').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  const act = { prev, next: () => next(), notes: toggleNotes, config: toggleConfig, full: toggleFull }[b.dataset.act];
  if (act) act();
});
addEventListener('resize', fit);
addEventListener('hashchange', () => { const i = fromHash(); if (i !== S) { stopAuto(); show(i, 0); } });
setInterval(() => {
  const el = notesEl.querySelector('.n-clock');
  el.textContent = t0 ? `Elapsed ${fmt(Date.now() - t0)}. This slide ${fmt(Date.now() - slideT0)}.` : 'The clock starts when you first advance.';
}, 500);
fit();
show(fromHash(), 0);
})();
</script>
